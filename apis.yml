aid: boss
name: Boss
description: >-
  Boss (BOSS Zhipin / BOSS直聘) is the largest online recruitment platform in China
  by average monthly active users, operated by Kanzhun Limited (NASDAQ: BZ, HKEX: 2076)
  and founded in 2014 in Beijing. It pioneered the "Direct Recruitment" model, a
  mobile-native experience that connects employers (bosses) and job seekers through
  instant direct chat rather than static resume exchange, with candidate and job
  matching powered by proprietary AI algorithms and big-data insights. The consumer
  job-search product at zhipin.com does not publish a public developer/job-data API;
  an authorized enterprise developer surface (BossHi mini-program open platform) exists
  for partners. This profile was surfaced as a portfolio company of hongshan and added
  to the API Evangelist network for enrichment.
